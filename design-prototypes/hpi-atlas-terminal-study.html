ns:minmax(0,1.53fr) minmax(0,1fr);gap:28px}.mapwrap{background:var(--land);border:1px solid var(--rule);position:relative;min-width:0}.mapbar{padding:13px 16px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--rule)}.mapcanvas{display:block;width:100%;height:auto;min-height:320px}.mapcanvas text{font:10px Arial;fill:var(--muted)}.maplegend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);font-size:12px}.mapstage{position:relative;overflow:hidden}.pins button{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;padding:0;min-height:38px;background:var(--surface);color:var(--ink);border:2px solid var(--action);font-weight:750;box-shadow:0 2px 5px #0003}.pins button[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:var(--accent);outline:3px solid var(--surface)}.pins .subject{background:var(--action);color:var(--on);border-radius:3px}.mapnote{padding:22px;min-height:0;display:grid;align-content:center;gap:15px;background:var(--surface)}.evidence{min-width:0}.sale{display:grid;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);padding:15px 0;grid-template-columns:35px 1fr;gap:12px;align-items:start}.sale[aria-pressed=true]{background:var(--quiet);box-shadow:inset 3px 0 var(--accent);padding-left:8px}.sale .rank{font:14px Consolas,monospace;color:var(--muted);padding-top:5px}.sale strong{display:block;font-size:24px;letter-spacing:-.04em}.sale small{display:block}.detail{border-top:1px solid var(--rule);padding:16px 0;margin-top:8px}.detail p{font-size:14px;margin:8px 0}.mobiletoggle{display:none}.tablewrap{overflow:auto}.compare{width:100%;border-collapse:collapse;min-width:510px}.compare th,.compare td{text-align:left;vertical-align:top;padding:18px 14px;border-bottom:1px solid var(--rule)}.compare th:first-child{width:25%;padding-left:0;color:var(--muted);font-weight:500}.compare t <script>
'use strict';
const properties=[{id:1,address:'1 Fictional Court',price:'$550,000.00',area:1600,count:3},{id:2,address:'2 Fictional Court',price:'$600,000.02',area:1600,count:0}];
const sales=[{rank:1,date:'2025-01-04',area:1600,age:87,diff:0},{rank:2,date:'2025-01-03',area:1580,age:88,diff:1.25},{rank:3,date:'2025-01-02',area:1620,age:89,diff:1.25}];
let view='signin',theme='atlas',signed=false,active=1,rank=1,mobile='evidence',geometry=false,saved=[],draft=[],notes={},comparisonSaved=false,savedComparison=null,comparisonName='My property comparison',query='',searchStatus='',candidate=null;
const app=document.getElementById('app'),nav=document.getElementById('nav');

function mapArt(){return '<svg class="mapcanvas" viewBox="0 0 620 390" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><pattern id="plots" width="58" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-17)"><rect width="58" height="48" fill="var(--land)"/><rect x="5" y="5" width="21" height="15" rx="1" fill="var(--parcel)"/><rect x="31" y="5" width="21" height="15" fill="var(--parcel)"/><rect x="5" y="25" width="21" height="15" fill="var(--parcel)"/><rect x="31" y="25" width="21" height="15" fill="var(--parcel)"/><path d="M0 0H58M0 48H58M0 0V48M58 0V48" stroke="var(--road)" stroke-width="4"/></pattern></defs><rect width="620" height="390" fill="url(#plots)"/><path d="M0 0H155L180 52 144 120 45 148 0 130Z" fill="var(--parcel)"/><path d="M540 0Q500 104 565 178T535 390H620V0Z" fill="var(--water)"/><g fill="none" stroke="var(--road)"><path d="M-10 275L630 78M147 -20L274 410M410 -20L540 410" stroke-width="19"/><path d="M-10 105L590 -60M-10 365L610 180M28 -20L155 410M280 -20L410 410" stroke-width="11"/></g><g fill="none" stroke="var(--rule)" stroke-width="1"><path d="M-10 275L630 78M147 -20L274 410M410 -20L540 410"/></g><path d="M199 118L371 77 440 260 262 312Z" fill="var(--accent)" fill-opacity=".07" stroke="var(--accent)" stroke-dasharray="5 7" stroke-width="1.4"/><text x="27" y="35" letter-spacing="2">ILLUSTRATED DISTRICT</text><text x="375" y="330" transform="rotate(-17 375 330)">FICTIONAL STREET GRID</text><path d="M595 24L595 62M588 33L595 24 602 33" stroke="var(--ink)" fill="none"/><text x="591" y="17">N</text></svg>'}
function head(k,t,desc,action=''){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+desc+'</p></div>'+action+'</div>'}
function foot(){return '<div class="foot">Prototype only. Fictional properties, sales and schematic geography. No actual authentication, cloud persistence, real locations or current valuation. Session-only review state.</div>'}
function open(id){active=id;rank=1;mobile='evidence';go('dossier')}
function go(v){view=v;render();app.focus({preventScroll:true});window.scrollTo(0,0)}
function render(){document.body.classList.toggle('terminal',theme==='terminal');document.getElementById('direction').textContent=theme==='atlas'?'01 · ATLAS ATELIER':'02 · INTELLIGENCE TERMINAL';document.getElementById('theme').textContent=theme==='atlas'?'Try Terminal':'Try Atlas';document.getElementById('exit').hidden=!signed;nav.innerHTML=signed?['workspace','investigate','saved','compare','methodology'].map(v=>btn(v==='workspace'?'Workspace':v==='investigate'?'Investigate':v==='saved'?'Saved':v==='compare'?'Compare':'Methodology','nav-'+v,'',((view===v||(v==='investigate'&&view==='dossier'))?'aria-current="page"':''))).join(''):'';
let s='';
if(view==='signin')s='<div class="entry"><div><div class="eyebrow">PRIVATE BUYER WORKSPACE / CONCEPT REVIEW</div><h1>Look beyond<br>the asking price.</h1><p>A considered approach to property research. Explore the historical evidence, understand its limits and compare your options.</p>'+btn('Enter fictional workspace','enter','primary')+'<p class="small">Simulated sign-in only. No credentials or account required.</p></div><div class="entryart">'+mapArt()+'<div class="eyebrow">01 / EVIDENCE FIRST</div></div></div>';
if(view==='workspace')s=head('YOUR WORKSPACE','A clearer view of property.','Investigate historical sales, return to your research and compare properties on your own terms.',btn('New investigation','nav-investigate','primary'))+'<div class="split"><section><div class="sectionhead"><h2>Recent investigations</h2><small>'+saved.length+' saved</small></div><div class="list">'+(saved.length?saved.map(id=>{const x=properties.find(y=>y.id===id);return '<div class="line"><div><b>'+x.address+'</b><p>'+label(x)+' · '+x.price+'</p></div>'+btn('Open dossier','open-'+id)+'</div>'}).join(''):'<div class="line"><div><b>No investigations yet</b><p>Start with a fictional address to explore the evidence.</p></div></div>')+'</div><div class="sectionhead" style="margin-top:34px"><h2>Comparisons</h2></div><div class="list">'+(savedComparison?'<div class="line"><div><b>'+esc(savedComparison.name)+'</b><p>Saved in this review session</p></div>'+btn('Open','reopen-comparison')+'</div>':'<p class="small" style="padding:16px 0">No saved comparisons yet.</p>')+'</div></section><aside class="workspace-feature"><div class="eyebrow">FIELD GUIDE / 01</div><h2>Evidence, not estimates.</h2><p>Completed historical sales can inform an investigation. They do not establish a current property value.</p>'+btn('Read methodology','nav-methodology')+mapArt()+'</aside></div>';
if(view==='investigate')s=head('NEW INVESTIGATION','Find a property.','Try 1 Fictional Court or 2 Fictional Court. Exact address matching in this review study.')+'<div class="form"><label>Property address<input id="query" value="'+esc(query)+'" placeholder="e.g. 1 Fictional Court"></label><div class="fields"><label>Analysis date<input type="date" value="2025-04-01" readonly></label><label>Buyer-reported area (sq ft)<input value="1600" readonly></label></div>'+btn('Find evidence','search','primary')+(searchStatus?'<div class="notice" id="search-message" role="status">'+esc(searchStatus)+'</div>':'')+(candidate?'<div class="line" id="search-candidate"><div><b>'+properties[candidate-1].address+'</b><p>One eligible fictional parcel · '+properties[candidate-1].price+' buyer-reported asking price</p></div>'+btn('Open investigation','candidate','primary')+'</div>':'')+'<p class="small" style="margin-top:20px">This review uses fixed fictional inputs to compare visual directions, not a live search API.</p></div>';
if(view==='dossier'){const x=p();s=head('PROPERTY DOSSIER / 01 APR 2025',x.address,'Fictional parcel · Building identity not verified.',btn(saved.includes(active)?'Saved':'Save investigation','save','primary',saved.includes(active)?'disabled':''))+'<div class="factstrip"><div><small>Buyer-reported asking price</small><b>'+x.price+'</b></div><div><small>Reported area</small><b>'+x.area.toLocaleString('en-US')+' sq ft</b></div><div><small>Eligible completed sales</small><b>'+x.count+'</b></div><div><small>Evidence status</small><b style="font-size:17px;letter-spacing:0">'+label(x)+'</b></div></div><div class="actions" style="margin-bottom:20px">'+btn(draft.includes(active)?'Added to comparison':'Add to comparison','add','',draft.includes(active)?'disabled':'')+btn('Open comparison ('+draft.length+')','nav-compare')+'</div><div class="mobiletoggle">'+btn('Evidence','mobile-evidence','',mobile==='evidence'?'aria-pressed="true"':'aria-pressed="false"')+btn('Map','mobile-map','',mobile==='map'?'aria-pressed="true"':'aria-pressed="false"')+'</div><div class="dossier" data-mobile="'+mobile+'" data-geometry="'+(geometry&&x.count?'schematic':'unavailable')+'"><section class="mapwrap"><div class="mapbar"><div><div class="eyebrow">GEOGRAPHIC CONTEXT</div><small>'+(geometry&&x.count?'Illustrated only · Not to scale':'Geometry unavailable')+'</small></div>'+btn(geometry?'Hide schematic':'Show schematic','geometry','',x.count?'':'disabled')+'</div>'+(geometry&&x.count?'<div class="mapstage">'+mapArt()+'<div class="pins"><button class="subject" style="left:49%;top:53%" aria-label="Fictional subject property" disabled>H</button>'+[[37,34],[64,39],[60,73]].map((v,i)=>'<button style="left:'+v[0]+'%;top:'+v[1]+'%" data-action="rank-'+(i+1)+'" aria-label="Select comparable '+(i+1)+'" aria-pressed="'+(rank===i+1)+'">'+(i+1)+'</button>').join('')+'</div></div><div class="maplegend">■ Subject &nbsp; · &nbsp; 1–3 Ranked evidence &nbsp; · &nbsp; Schematic only</div>':'<div class="mapnote"><div class="eyebrow">LOCATION NOT VERIFIED</div><h2>No geographic evidence to display.</h2><p class="small">The private evidence contract withholds coordinates. Historical sales remain accessible. '+(x.count?'Use the schematic toggle to review the intended linked interaction.':'No eligible sales or map markers for this case.')+'</p></div>')+'</section><section class="evidence"><div class="sectionhead"><h2>Comparable evidence</h2><small>'+x.count+' eligible</small></div>'+(x.count?sales.map(z=>'<button class="sale" data-action="rank-'+z.rank+'" aria-pressed="'+(rank===z.rank)+'"><span class="rank">0'+z.rank+'</span><span><strong>$525,000.01</strong><small>'+z.date+' · '+z.area.toLocaleString('en-US')+' sq ft</small><small>'+z.age+' days earlier · '+z.diff+'% area difference</small></span></button>').join('')+'<div class="detail"><div class="eyebrow">WHY SALE 0'+rank+' QUALIFIES</div><p>Earlier completed sale · Same neighbourhood · '+sales[rank-1].diff+'% illustrative area difference.</p><small>2024 assessment characteristics. Historical availability not established.</small></div>':'<div class="notice"><h3>Insufficient historical evidence</h3><p>No eligible sales. No comparison with previous sales can be supported.</p></div>')+'</section></div><div class="foot">Evidence mode: historical-shaped fictional rehearsal. Exact sale cents shown for design review. No model, verified location or current valuation.</div>'}
if(view==='saved')s=head('RESEARCH LIBRARY','Saved properties.','Reopen a dossier or add a property to your comparison. Saved data lasts only for this review session.')+'<div class="list">'+(saved.length?saved.map(id=>{let x=properties[id-1];return '<div class="line"><div><b>'+x.address+'</b><p>'+label(x)+' · '+x.price+'</p></div><div class="actions">'+btn('Open','open-'+id)+btn(draft.includes(id)?'Added':'Compare','add-'+id,'',draft.includes(id)?'disabled':'')+'</div></div>'}).join(''):'<div class="notice">No saved properties. Open and save a fictional dossier first.</div>')+'</div>';

if(view==='methodology')s=head('METHODOLOGY','Evidence has limits.','How to interpret the historical investigation.')+'<div class="list">'+[['Historical sales','Earlier completed transactions, not listing or current market prices.'],['Selection','The design illustrates ranked evidence with prior-year characteristics, recency, area and location evidence.'],['Geography','Schematic map positions are invented, not real coordinates or distance evidence. The actual private API withholds geometry.'],['Uncertainty','Insufficient data is a valid result. No current valuation or prediction is shown.'],['Privacy','This standalone study has no authentication, storage beyond the page session or network requests.']].map(([t,d])=>'<div class="line"><div><b>'+t+'</b><p>'+d+'</p></div></div>').join('')+'</div>';

document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;candidate=null;searchStatus='';document.getElementById('search-message')?.remove();document.getElementById('search-candidate')?.remove();}if(e.target.id==='comparison-name'){comparisonName=e.target.value;comparisonSaved=false;document.getElementById('save-confirmation')?.remove();}if(e.target.dataset.note){notes[e.target.dataset.note]=e.target.value;comparisonSaved=false;document.getElementById('save-confirmation')?.remove();}});
document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el||el.disabled)return;if(el.id==='theme'){theme=theme==='atlas'?'terminal':'atlas';render();return}if(el.id==='exit'){signed=false;saved=[];draft=[];notes={};comparisonSaved=false;savedComparison=null;comparisonName='My property comparison';active=1;rank=1;mobile='evidence';geometry=false;query='';candidate=null;searchStatus='';go('signin');return}let a=el.dataset.action;if(!a)return;if(a==='enter'){signed=true;go('workspace')}else if(a.startsWith('nav-'))go(a.slice(4));else if(a==='search'){candidate=properties.find(x=>x.address.toLowerCase()===query.trim().toLowerCase())?.id||null;searchStatus=candidate?'One eligible fictional candidate found.':'No matching fictional parcel. Try either example address.';render()}else if(a==='candidate'&&candidate)open(candidate);else if(a.startsWith('open-'))open(Number(a.slice(5)));else if(a==='save'){if(!saved.includes(active))saved.push(active);render()}else if(a==='add'||a.startsWith('add-')){let id=a==='add'?active:Number(a.slice(4));if(!saved.includes(id))saved.push(id);if(!draft.includes(id))draft.push(id);comparisonSaved=false;render()}else if(a.startsWith('remove-')){draft=draft.filter(id=>id!==Number(a.slice(7)));comparisonSaved=false;render()}else if(a==='save-comparison'){if(draft.length===2&&comparisonName.trim()){savedComparison={name:comparisonName.trim(),ids:[...draft],notes:{...notes}};comparisonSaved=true;render()}}else if(a==='reopen-comparison'&&savedComparison){draft=[...savedComparison.ids];notes={...savedComparison.notes};comparisonName=savedComparison.name;comparisonSaved=true;go('compare')}else if(a.startsWith('rank-')){rank=Number(a.slice(5));const fromMap=!!el.closest('.pins');render();const target=app.querySelector((fromMap?'.pins ':'.sale')+'[data-action="'+a+'"]');if(target&&target.getClientRects().length)target.focus({preventScroll:true})}else if(a==='geometry'){geometry=!geometry;render()}else if(a.startsWith('mobile-')){mobile=a.slice(7);render()}});
