name: PostgreSQL HTTP runtime integration
on:
  push:
    branches: [development]
    paths: ['backend/**', 'frontend/react/**', '.github/workflows/postgres-runtime.yml']
  pull_request:
    branches: [development, main]
    paths: ['backend/**', 'frontend/react/**', '.github/workflows/postgres-runtime.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: hpi_fixture
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d hpi_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend/react
      - run: npm run build --prefix frontend/react
      - run: python -m pip install --only-binary=:all: --upgrade pip==26.3
      - run: python -m pip install --only-binary=:all: -r backend/requirements-runtime.txt 'playwright==1.56.0'
      - run: python -m playwright install --with-deps chromium
      - name: Real PostgreSQL, HTTP concurrency, ownership, revision and Chromium
        env:
          HPI_RELEASE_SCREENSHOTS: ${{ runner.temp }}/hpi-release
          HPI_PG_CONTAINER: ${{ job.services.postgres.id }}
          HPI_PG_DSN: postgresql://postgres:fictional-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/hpi_fixture
        run: python -m unittest discover -s backend/postgres_runtime_tests -v

      - name: Export fixed invented seed for reviewed operator transaction
        run: python -m backend.neon_synthetic_seed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-release-screenshots
          path: ${{ runner.temp }}/hpi-release/*.png
          if-no-files-found: warn
          retention-days: 7
