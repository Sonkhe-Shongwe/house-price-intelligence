name: Restricted Neon development connection acceptance
on:
  push:
    branches: [development]
    paths: ['.github/authorisations/neon-restricted-preflight-v7.txt']
permissions:
  contents: read
concurrency:
  group: neon-restricted-preflight-v7
  cancel-in-progress: false
jobs:
  preflight:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: neon-development-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source parent and one-time marker
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          marker=.github/authorisations/neon-restricted-preflight-v7.txt
          test "$BEFORE" = "$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-status "$BEFORE" "$GITHUB_SHA" -- "$marker")" = "$(printf 'A\t%s' "$marker")"
          test "$(cat "$marker")" = "$(printf 'neon-restricted-preflight-v7\nsource=%s' "$BEFORE")"
          test "$(git diff --name-only "$BEFORE" "$GITHUB_SHA")" = "$marker"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install previously qualified runtime dependencies
        run: python -m pip install 'psycopg[binary]==3.2.9' 'psycopg_pool==3.2.6'
      - name: Verify development server certificate without passwords
        env:
          HPI_NEON_DEVELOPMENT_HOST: ${{ secrets.HPI_NEON_DEVELOPMENT_HOST }}
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          python - <<'PY'
          import os
          import socket
          import ssl
          import struct
          from backend.neon_preflight import HOST

          host = os.environ.get("HPI_NEON_DEVELOPMENT_HOST", "")
          if not HOST.fullmatch(host) or "-pooler" in host:
              raise SystemExit("TLS probe refused: endpoint configuration")
          try:
              context = ssl.create_default_context(cafile=os.environ["SSL_CERT_FILE"])
          except (OSError, ssl.SSLError):
              raise SystemExit("TLS probe failed: system CA bundle")
          try:
              with socket.create_connection((host, 5432), timeout=15) as conn:
                  conn.settimeout(15)
                  conn.sendall(struct.pack("!II", 8, 80877103))
                  if conn.recv(1) != b"S":
                      raise SystemExit("TLS probe failed: PostgreSQL TLS negotiation")
                  with context.wrap_socket(conn, server_hostname=host):
                      print("TLS probe passed: trusted certificate and hostname verified; no database credentials used")
          except ssl.SSLCertVerificationError as exc:
              raise SystemExit("TLS probe failed: certificate verification code " + str(exc.verify_code)) from None
          except (OSError, ssl.SSLError):
              raise SystemExit("TLS probe failed: transport or TLS handshake") from None
          PY
      - name: Restricted direct TLS and permission qualification
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          HPI_NEON_MODE: development-restricted-preflight
          HPI_NEON_DEVELOPMENT_HOST: ${{ secrets.HPI_NEON_DEVELOPMENT_HOST }}
          HPI_NEON_READER_DSN: ${{ secrets.HPI_NEON_READER_DSN }}
          HPI_NEON_BUYER_DSN: ${{ secrets.HPI_NEON_BUYER_DSN }}
        run: python -m backend.neon_service_preflight
