name: Restricted Neon development connection acceptance
on:
  push:
    branches: [development]
    paths: ['.github/authorisations/neon-restricted-preflight-v2.txt']
permissions:
  contents: read
concurrency:
  group: neon-restricted-preflight-v2
  cancel-in-progress: false
jobs:
  preflight:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: neon-development-preflight
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify separately reviewed source and one-time marker
        env:
          BEFORE: ${{ github.event.before }}
          APPROVED_SHA: ${{ vars.HPI_NEON_PREFLIGHT_APPROVED_SHA }}
        run: |
          set -eu
          marker=.github/authorisations/neon-restricted-preflight-v2.txt
          test -n "$APPROVED_SHA"
          test "$BEFORE" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD^)" = "$APPROVED_SHA"
          test "$(git diff --name-status "$BEFORE" "$GITHUB_SHA" -- "$marker")" = "$(printf 'A\t%s' "$marker")"
          test "$(cat "$marker")" = "owner-approved-neon-restricted-preflight-v2"
          test "$(git diff --name-only "$BEFORE" "$GITHUB_SHA")" = "$marker"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install previously qualified runtime dependencies
        run: python -m pip install 'psycopg[binary]==3.2.9' 'psycopg_pool==3.2.6'
      - name: Restricted direct TLS and permission qualification
        env:
          HPI_NEON_MODE: development-restricted-preflight
          HPI_NEON_DEVELOPMENT_HOST: ${{ secrets.HPI_NEON_DEVELOPMENT_HOST }}
          HPI_NEON_READER_DSN: ${{ secrets.HPI_NEON_READER_DSN }}
          HPI_NEON_BUYER_DSN: ${{ secrets.HPI_NEON_BUYER_DSN }}
        run: python -m backend.neon_service_preflight
