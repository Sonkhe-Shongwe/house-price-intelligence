name: Bounded address source feasibility
on:
  push:
    branches: [development]
    paths: ['audit/source_readiness/address_audit.py', '.github/workflows/address-readiness.yml']
permissions:
  contents: read
jobs:
  address-aggregate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s audit/source_readiness/tests -v
      - name: At most one metadata and two aggregate requests
        run: python -m audit.source_readiness.address_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: address-feasibility-aggregate
          path: reports/address-feasibility.json
          if-no-files-found: warn
          retention-days: 14
