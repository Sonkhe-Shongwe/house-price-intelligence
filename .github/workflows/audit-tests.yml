name: Phase 0 audit tests

on:
  push:
  pull_request:

jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        working-directory: audit/phase0
        run: python -m unittest discover -s tests -v
