name: Property audit unit tests

on:
  push:
    branches: [main]
  pull_request:

# Test untrusted PRs with read-only repository access. No secrets or live-source data.
permissions:
  contents: read

jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node for JavaScript syntax verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase 0 offline unit tests
        working-directory: audit/phase0
        run: python -m unittest discover -s tests -v
      - name: Run Phase 1 offline unit tests
        working-directory: audit/phase1
        run: python -m unittest discover -s tests -v
      - name: Run Phase 2 offline unit tests
        working-directory: audit/phase2
        run: python -m unittest discover -s tests -v
      - name: Run artifact exporter offline unit tests
        working-directory: audit/cloud
        run: python -m unittest discover -s tests -v
      - name: Run P3 fixture-only application tests
        run: python -m unittest discover -s backend/tests -v
      - name: Verify actual browser JavaScript syntax
        run: node --check frontend/app.js
      - name: Validate documentation links and phase percentages
        run: python tools/check_docs.py

  synthetic-browser-acceptance:
    # Pin the runner supported by our browser toolchain; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only Playwright and Chromium
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Exercise real Chromium -> localhost HTTP -> synthetic SQLite
        run: python -m unittest discover -s browser_tests -p 'test_*.py' -v
