name: Property audit unit tests

on:
  push:
    # Run on every accepted release and every development commit.
    branches: [main, development, 'feature/**']
  pull_request:
    branches: [main, development]

# Test untrusted PRs with read-only repository access. No secrets or live-source data.
permissions:
  contents: read

jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node for JavaScript syntax verification
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase 0 offline unit tests
        working-directory: audit/phase0
        run: python -m unittest discover -s tests -v
      - name: Run Phase 1 offline unit tests
        working-directory: audit/phase1
        run: python -m unittest discover -s tests -v
      - name: Run Phase 2 offline unit tests
        working-directory: audit/phase2
        run: python -m unittest discover -s tests -v
      - name: Run artifact exporter offline unit tests
        working-directory: audit/cloud
        run: python -m unittest discover -s tests -v
      - name: Run P3 fixture-only application tests
        run: python -m unittest discover -s backend/tests -v
      - name: Qualify disposable basemap filesystem and process limits (invented files only)
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d "${RUNNER_TEMP}/hpi-basemap-limits.XXXXXX")"
          cleanup() {
            if mountpoint -q "$work"; then sudo umount "$work"; fi
            rmdir "$work"
          }
          trap cleanup EXIT
          sudo mount -t tmpfs -o "size=128m,nr_inodes=4096,uid=$(id -u),gid=$(id -g),mode=0700,nosuid,nodev" tmpfs "$work"
          timeout --signal=TERM --kill-after=5s 60s python -m tools.qualify_basemap_limits "$work"
      - name: Verify actual browser JavaScript syntax
        run: node --check frontend/app.js
      - name: Install district geometry test dependency
        run: python -m pip install "shapely==2.1.2" "pyproj==3.7.2" "pypdf==7.2.0"
      - name: Test offline Wikidata spatial pilot (invented data only)
        run: python -m unittest tools.test_wikidata_spatial_pilot -v
      - name: Install pinned raster pilot wheel
        run: |
          python -m pip install --only-binary=:all: "rasterio==1.5.2"
      - name: Test offline GHSL raster pilot (invented data only)
        run: python -m unittest tools.test_ghsl_raster_pilot -v
      - name: Test offline HPI Data Manager (invented data only)
        run: python tools/hpi_data_manager.py --self-test
      - name: Validate documentation links and phase percentages
        run: python tools/check_docs.py

  synthetic-browser-acceptance:
    # Pin the runner supported by our browser toolchain; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test-only Playwright and Chromium
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Exercise real Chromium -> localhost HTTP -> synthetic SQLite
        env:
          HPI_DESIGN_SCREENSHOTS: ${{ runner.temp }}/hpi-visual-preview
        run: python -m unittest discover -s browser_tests -p 'test_*.py' -v
      - name: Publish offline Visual Foundation prototype screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpi-visual-study-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hpi-visual-preview/*.png
            design-prototypes/map-evidence-studio.html
            design-prototypes/hpi-atlas-terminal-study.html
          if-no-files-found: warn
          retention-days: 7
