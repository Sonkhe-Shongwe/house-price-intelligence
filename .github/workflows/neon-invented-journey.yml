name: Persistent Neon invented buyer journey
on:
  push:
    branches: [development]
    paths: ['.github/authorisations/neon-invented-journey-v3.txt']
permissions:
  contents: read
concurrency:
  group: neon-invented-journey-v3
  cancel-in-progress: false
jobs:
  journey:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: neon-development-preflight
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: hpi_fixture
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d hpi_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source parent and one-time marker
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          marker=.github/authorisations/neon-invented-journey-v3.txt
          test "$BEFORE" = "$(git rev-parse HEAD^)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-status "$BEFORE" "$GITHUB_SHA" -- "$marker")" = "$(printf 'A\t%s' "$marker")"
          test "$(cat "$marker")" = "$(printf 'neon-invented-journey-v3\nsource=%s' "$BEFORE")"
          test "$(git diff --name-only "$BEFORE" "$GITHUB_SHA")" = "$marker"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend/react
      - run: npm run build --prefix frontend/react
      - run: python -m pip install 'psycopg[binary]==3.2.9' 'psycopg_pool==3.2.6' 'playwright==1.56.0' 'PyJWT[crypto]==2.15.1'
      - run: python -m playwright install --with-deps chromium
      - name: Prepare independent seal from local invented database
        env:
          HPI_PG_DSN: postgresql://postgres:fictional-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/hpi_fixture
        run: |
          set -eu
          install -d -m 0700 "$RUNNER_TEMP/hpi-invented-acceptance"
          python -m backend.neon_invented_acceptance prepare "$RUNNER_TEMP/hpi-invented-acceptance"
      - name: Restricted persistent Neon browser journey
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          HPI_NEON_MODE: development-invented-journey
          HPI_NEON_DEVELOPMENT_HOST: ${{ secrets.HPI_NEON_DEVELOPMENT_HOST }}
          HPI_NEON_READER_DSN: ${{ secrets.HPI_NEON_READER_DSN }}
          HPI_NEON_BUYER_DSN: ${{ secrets.HPI_NEON_BUYER_DSN }}
        run: python -m backend.neon_invented_acceptance run "$RUNNER_TEMP/hpi-invented-acceptance"
