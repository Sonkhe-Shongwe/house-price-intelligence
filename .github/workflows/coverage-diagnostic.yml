name: Aggregate source coverage diagnostic
on:
  push:
    branches: [development]
    paths: ['audit/source_readiness/coverage_diagnostic.py','.github/workflows/coverage-diagnostic.yml']
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s audit/source_readiness/tests -v
      - run: python -m audit.source_readiness.coverage_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-diagnostic-aggregate
          path: reports/coverage-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
