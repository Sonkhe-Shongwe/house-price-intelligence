name: Isolated full React and MapLibre V1.2 proof

on:
  push:
    branches: ['feature/react-maplibre-full-spike-validation-20261123']
    paths:
      - 'design-prototypes/react-map-spike/**'
      - '.github/workflows/react-map-full-source-ci.yml'
  pull_request:
    branches: [development]
    paths:
      - 'design-prototypes/react-map-spike/**'
      - '.github/workflows/react-map-full-source-ci.yml'

permissions:
  contents: read

jobs:
  full-source-esm-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: design-prototypes/react-map-spike/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean pinned install, TypeScript and production ESM build
        working-directory: design-prototypes/react-map-spike
        run: |
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run build
      - name: Verify React presentation adapter against REAL fixture-only WSGI P3/P6 JSON
        run: |
          mkdir -p "$RUNNER_TEMP/hpi-source-bridge"
          PYTHONPATH=. python design-prototypes/react-map-spike/tests/export_real_api_contract.py > "$RUNNER_TEMP/hpi-source-bridge/actual-http.json"
          design-prototypes/react-map-spike/node_modules/.bin/tsc \
            --target ES2022 --lib ES2022,DOM --module ESNext --moduleResolution Bundler \
            --strict --skipLibCheck --noEmit false \
            --outDir "$RUNNER_TEMP/hpi-source-bridge" \
            design-prototypes/react-map-spike/src/evidenceBridge.ts
          mv "$RUNNER_TEMP/hpi-source-bridge/evidenceBridge.js" \
             "$RUNNER_TEMP/hpi-source-bridge/evidenceBridge.mjs"
          node design-prototypes/react-map-spike/tests/test_evidence_bridge.mjs \
            "$RUNNER_TEMP/hpi-source-bridge/actual-http.json" \
            "$RUNNER_TEMP/hpi-source-bridge/evidenceBridge.mjs"
      - name: Verify deferred map chunk and same-origin worker bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('design-prototypes/react-map-spike/dist/assets')
          initial=list(base.glob('index-*.js'))
          vector=list(base.glob('VectorMap-*.js'))
          workers=list(base.glob('maplibre-gl-worker-*.js'))
          assert len(initial)==1 and len(vector)==1 and len(workers)==1, (initial,vector,workers)
          sizes={'initial_js':initial[0].stat().st_size,'optional_map_js':vector[0].stat().st_size,'separate_worker_js':workers[0].stat().st_size}
          print('Production bundle bytes:',sizes,flush=True)
          assert sizes['initial_js']<400_000, 'Initial app unexpectedly includes vector renderer'
          assert sizes['optional_map_js']<1_400_000
          assert sizes['separate_worker_js']<850_000
          PY
      - name: Use runner Chrome or install pinned test-only Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          if command -v google-chrome >/dev/null; then
            echo "HPI_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null; then
            echo "HPI_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            python -m playwright install chromium
          fi
      - name: Six actual ESM and WebGL2 browser journeys
        env:
          HPI_SPIKE_SCREENSHOTS: ${{ runner.temp }}/hpi-react-full-spike-screenshots
          HPI_REQUIRE_WEBGL: '1'
        run: python -m unittest discover -s design-prototypes/react-map-spike/tests -p 'test_react_map_spike.py' -v
      - name: React source review on same-origin READ-ONLY Python WSGI + frozen SQLite
        env:
          HPI_SOURCE_SCREENSHOTS: ${{ runner.temp }}/hpi-source-connected-screenshots
        run: python -m unittest discover -s design-prototypes/react-map-spike/tests -p 'test_source_review.py' -v
      - name: Explicit parcel selection, saved investigation and frozen reopen in real Chrome
        env:
          HPI_BUYER_SCREENSHOTS: ${{ runner.temp }}/hpi-buyer-workflow-screenshots
        run: python -m unittest discover -s design-prototypes/react-map-spike/tests -p 'test_buyer_workflow.py' -v
      - name: Opt-in source-backed shortlist and editable-notes Chrome acceptance
        env:
          HPI_SHORTLIST_SCREENSHOTS: ${{ runner.temp }}/hpi-shortlist-workflow-screenshots
        run: python -m unittest discover -s design-prototypes/react-map-spike/tests -p 'test_saved_comparison.py' -v
      - name: Real-process SQLite restart, frozen sale hashes and shortlist note recovery
        run: python -m unittest discover -s design-prototypes/react-map-spike/tests -p 'test_persistent_restart.py' -v
      - name: Publish visual-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpi-react-map-full-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hpi-react-full-spike-screenshots/*.png
            ${{ runner.temp }}/hpi-source-connected-screenshots/*.png
            ${{ runner.temp }}/hpi-buyer-workflow-screenshots/*.png
            ${{ runner.temp }}/hpi-shortlist-workflow-screenshots/*.png
            design-prototypes/react-map-spike/dist/**
          if-no-files-found: warn
          retention-days: 7
