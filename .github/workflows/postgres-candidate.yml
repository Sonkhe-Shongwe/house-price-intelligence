name: PostgreSQL synthetic compatibility
on:
  push:
    branches: [development]
    paths: ['backend/**', '.github/workflows/postgres-candidate.yml']
  pull_request:
    branches: [development, main]
    paths: ['backend/**', '.github/workflows/postgres-candidate.yml']
permissions:
  contents: read
jobs:
  postgres-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: hpi_fixture
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d hpi_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Synthetic migrations, canonical service parity, restore and isolation
        env:
          HPI_PG_DSN: postgresql://postgres:fictional-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/hpi_fixture
          HPI_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m unittest discover -s backend/postgres_tests -v
